<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* The theme's colours are set from Dave (Settings → Theme); the dark colours get a hint of the theme */
  :root {
    --purple: #9646ff; --violet: #6e5aff; --cyan: #00d2ff; --pink: #dc50e6; --deep: #100a26;
    --bg: color-mix(in srgb, var(--deep) 40%, #0b0b11); --panel: color-mix(in srgb, var(--deep) 30%, #16161f);
    --panel2: color-mix(in srgb, var(--deep) 30%, #1d1d29); --line: color-mix(in srgb, var(--deep) 25%, #2a2a38);
    --glass: color-mix(in srgb, var(--deep) 55%, rgba(30, 30, 44, .82)); --text: #ececf4; --dim: #8d8da6;
    --grad: linear-gradient(135deg, var(--purple), var(--violet) 50%, var(--cyan));
  }
  /* Legacy theme: the original window, plain dark without the moving light and glass */
  body.legacy .aurora, body.legacy::after { display: none; }
  body.legacy nav { background: var(--panel); backdrop-filter: none; border-right-color: var(--line); }
  body.legacy .card { background: var(--panel); backdrop-filter: none; border-color: var(--line); }
  body.legacy .msg.dave { background: var(--panel2); border: 1px solid var(--line); backdrop-filter: none; }
  body.legacy .logo { background: var(--grad); }
  body.legacy .logo::before, body.legacy .logo::after { display: none; }
  body.legacy header h1 { background: none; color: var(--text); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--text);
    font: 14px/1.45 "Segoe UI Variable Text", "Segoe UI", sans-serif; overflow: hidden; user-select: none; }
  html { background: var(--bg); } /* only here: a background on body would cover the light layer below */

  /* Slowly drifting coloured light behind everything; the panels on top are frosted glass */
  .aurora { position: fixed; inset: -20%; z-index: -1; filter: blur(80px); opacity: .9; pointer-events: none; }
  .aurora i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; mix-blend-mode: screen; }
  .aurora i:nth-child(1) { background: var(--purple); top: 0; left: 5%; animation: drift1 26s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { background: var(--cyan); bottom: 0; right: 0; animation: drift2 31s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { background: var(--pink); top: 35%; left: 40%; width: 30vmax; height: 30vmax; opacity: .7; animation: drift3 22s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(30vw, 25vh) scale(1.2); } }
  @keyframes drift2 { to { transform: translate(-35vw, -20vh) scale(.85); } }
  @keyframes drift3 { to { transform: translate(-25vw, 20vh) scale(1.3); } }
  body::after { content: ""; position: fixed; inset: 0; z-index: -1; background: rgba(10, 10, 18, .6); pointer-events: none; }
  /* minmax(0, …) and min-height: 0 let every part shrink with the window, so the typing bar never falls off the bottom */
  .app { display: grid; grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); height: 100vh; }

  /* Sidebar */
  nav { background: rgba(23, 23, 36, .55); backdrop-filter: blur(24px) saturate(150%); border-right: 1px solid rgba(255, 255, 255, .07); display: flex; flex-direction: column; padding: 18px 12px; gap: 4px;
    min-height: 0; overflow-y: auto; overflow-x: hidden; }
  nav::-webkit-scrollbar { width: 0; }
  .brand { display: flex; align-items: center; gap: 12px; padding: 4px 8px 20px; }
  /* Dave's orb: swirling light in dark glass, like the bubble. Spins faster and pulses while he's busy. */
  .logo { width: 42px; height: 42px; border-radius: 50%; flex: none; position: relative; overflow: hidden; background: var(--deep);
    box-shadow: 0 0 22px color-mix(in srgb, var(--purple) 55%, transparent), 0 0 44px color-mix(in srgb, var(--cyan) 18%, transparent), inset 0 0 0 1px rgba(255, 255, 255, .35); }
  .logo::before { content: ""; position: absolute; inset: -30%; filter: blur(7px);
    background: radial-gradient(circle at 30% 35%, var(--purple) 0 22%, transparent 42%), radial-gradient(circle at 70% 30%, var(--cyan) 0 18%, transparent 40%),
                radial-gradient(circle at 60% 72%, var(--pink) 0 20%, transparent 42%), radial-gradient(circle at 35% 70%, var(--violet) 0 16%, transparent 38%);
    animation: swirl 7s linear infinite; }
  .logo::after { content: ""; position: absolute; left: 22%; top: 8%; width: 55%; height: 32%; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(255, 255, 255, .5), transparent 70%); }
  .logo.busy::before { animation-duration: 1.4s; }
  .logo.busy { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes swirl { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { box-shadow: 0 0 34px color-mix(in srgb, var(--cyan) 85%, transparent), 0 0 60px color-mix(in srgb, var(--purple) 40%, transparent), inset 0 0 0 1px rgba(255, 255, 255, .5); transform: scale(1.07); } }
  .brand b { font-size: 18px; display: block; }
  .brand small { color: var(--dim); font-size: 12px; }
  .tab { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--dim); cursor: pointer; transition: .15s; }
  .tab:hover { background: var(--panel2); color: var(--text); }
  .tab.active { background: var(--panel2); color: var(--text); box-shadow: inset 3px 0 0 var(--cyan); }
  .tab .ico { width: 22px; text-align: center; font-size: 16px; }
  .tab .count { margin-left: auto; font-size: 11px; background: var(--line); border-radius: 10px; padding: 1px 8px; }
  .spacer { flex: 1; }
  .toggle { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; color: var(--dim); border-radius: 10px; cursor: pointer; }
  .toggle:hover { background: var(--panel2); color: var(--text); }
  .switch { width: 34px; height: 20px; border-radius: 10px; background: var(--line); position: relative; transition: .2s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch.on { background: var(--violet); }
  .switch.on::after { left: 17px; }

  /* Main */
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  header { padding: 22px 28px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; gap: 12px; flex: none; min-width: 0; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; white-space: nowrap; background: linear-gradient(90deg, #fff 30%, color-mix(in srgb, var(--purple) 45%, #fff) 70%, color-mix(in srgb, var(--cyan) 55%, #fff));
    -webkit-background-clip: text; color: transparent; }
  header span { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .view { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 20px 28px; display: none; }
  .view.active { display: block; }
  .view::-webkit-scrollbar { width: 10px; }
  .view::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid var(--bg); }
  .empty { color: var(--dim); text-align: center; padding: 60px 20px; }
  .empty .big { font-size: 36px; display: block; margin-bottom: 8px; }

  /* Chat */
  #chat.view.active { display: flex; flex-direction: column; gap: 6px; }
  .day { align-self: center; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  .msg { max-width: 72%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; user-select: text; }
  .msg.you { align-self: flex-end; background: var(--grad); border-bottom-right-radius: 4px; box-shadow: 0 6px 22px color-mix(in srgb, var(--violet) 30%, transparent); }
  /* Dave's messages: frosted glass with a fine gradient edge */
  .msg.dave { align-self: flex-start; border: 1px solid transparent; border-bottom-left-radius: 4px; backdrop-filter: blur(14px);
    background: linear-gradient(var(--glass), var(--glass)) padding-box,
                linear-gradient(135deg, color-mix(in srgb, var(--purple) 65%, transparent), rgba(255, 255, 255, .08) 40%, color-mix(in srgb, var(--cyan) 55%, transparent)) border-box; }
  .msg.new { animation: arrive .35s cubic-bezier(.2, .9, .3, 1.2); }
  .msg.you.new { transform-origin: right bottom; } .msg.dave.new { transform-origin: left bottom; }
  @keyframes arrive { from { opacity: 0; transform: translateY(12px) scale(.96); } }
  .msg .time { display: block; font-size: 11px; opacity: .6; margin-top: 4px; }
  .msg.pending { opacity: .6; }
  .typing { align-self: flex-start; background: var(--panel2); border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; display: none; gap: 5px; }
  .typing.show { display: flex; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); animation: dot 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes dot { 50% { opacity: .2; transform: translateY(-3px); } }
  .composer { display: none; gap: 10px; padding: 14px 28px 20px; border-top: 1px solid var(--line); flex: none; min-width: 0; }
  .composer.show { display: flex; }
  .composer input { flex: 1; min-width: 0; background: var(--panel2); border: 1px solid var(--line); border-radius: 22px; padding: 11px 18px; color: var(--text); font: inherit; outline: none; }
  .composer input:focus { border-color: var(--violet); }
  .round { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--grad); color: #fff; font-size: 17px; cursor: pointer; flex: none; transition: .15s; }
  .round:hover { filter: brightness(1.15); transform: scale(1.05); }
  .round.alt { background: var(--panel2); border: 1px solid var(--line); }
  /* Listening: the microphone glows and pulses (instead of the bubble, which stays away while this window is open) */
  .round.alt.listening { background: var(--grad); border-color: transparent; animation: listen 1.1s ease-in-out infinite; }
  @keyframes listen { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--cyan) 25%, transparent), 0 0 28px var(--purple); transform: scale(1.08); } }

  /* Lists and cards */
  .card { background: rgba(23, 23, 36, .62); backdrop-filter: blur(18px); border: 1px solid rgba(255, 255, 255, .07); border-radius: 14px; transition: .15s; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; gap: 14px; }
  .card .main { flex: 1; min-width: 0; }
  .card .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .card .sub { color: var(--dim); font-size: 13px; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 10px; background: color-mix(in srgb, var(--violet) 18%, transparent); color: color-mix(in srgb, var(--violet) 55%, #fff); white-space: nowrap; }
  .x { width: 30px; height: 30px; border-radius: 8px; border: 0; background: transparent; color: var(--dim); font-size: 16px; cursor: pointer; flex: none; }
  .x:hover { background: rgba(255, 80, 120, .15); color: #ff6b8b; }
  .btn { border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 10px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .btn:hover { border-color: var(--violet); }
  .row { display: flex; gap: 10px; margin-bottom: 16px; }
  .row input { flex: 1; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; color: var(--text); font: inherit; outline: none; }
  .row input:focus { border-color: var(--violet); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); margin: 22px 0 10px; font-weight: 600; }
  h2:first-child { margin-top: 0; }

  /* Screen time */
  .seg { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; margin-bottom: 16px; }
  .seg button { border: 0; background: transparent; color: var(--dim); padding: 6px 14px; border-radius: 7px; font: inherit; cursor: pointer; }
  .seg button.on { background: var(--panel2); color: var(--text); }
  .total { font-size: 30px; font-weight: 700; background: var(--grad); -webkit-background-clip: text; color: transparent; margin-bottom: 14px; }
  .bar { display: grid; grid-template-columns: 170px 1fr 70px; gap: 12px; align-items: center; margin-bottom: 9px; }
  .bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .track { height: 10px; background: var(--panel2); border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--grad); border-radius: 5px; transition: width .4s; }
  .bar .val { color: var(--dim); text-align: right; font-size: 13px; }
  .week { display: flex; align-items: flex-end; gap: 10px; height: 120px; padding: 10px 4px 0; margin-bottom: 8px; }
  .week div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; }
  .week i { width: 100%; max-width: 38px; border-radius: 6px 6px 3px 3px; background: var(--grad); min-height: 3px; transition: height .4s; }
  .week span { color: var(--dim); font-size: 12px; }

  /* Music */
  .now { background: linear-gradient(135deg, color-mix(in srgb, var(--purple) 25%, transparent), color-mix(in srgb, var(--cyan) 15%, transparent)); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; display: flex; gap: 16px; align-items: center; margin-bottom: 8px; }
  .disc { width: 54px; height: 54px; border-radius: 50%; background: conic-gradient(var(--purple), var(--cyan), var(--pink), var(--purple)); animation: spin 6s linear infinite; position: relative; flex: none; }
  .disc::after { content: ""; position: absolute; inset: 20px; border-radius: 50%; background: var(--bg); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .now .title { font-size: 17px; font-weight: 600; }

  /* Narrow window: the sidebar shrinks to icons, so the content keeps its room */
  @media (max-width: 760px) {
    .app { grid-template-columns: 64px minmax(0, 1fr); }
    nav { padding: 14px 8px; align-items: center; }
    nav [data-t], .brand > div:last-child, .tab .count { display: none; }
    .brand { padding: 0 0 14px; }
    .tab { justify-content: center; padding: 10px; width: 46px; }
    .tab .ico { width: auto; }
    .toggle { flex-direction: column; gap: 6px; padding: 8px 4px; }
    .tab.active { box-shadow: inset 0 -3px 0 var(--cyan); }
  }
  @media (max-width: 560px) {
    header { padding: 14px 16px 10px; }
    header span { display: none; }
    .view { padding: 14px 16px; }
    .composer { padding: 10px 14px 14px; gap: 8px; }
    .round { width: 40px; height: 40px; }
    .msg { max-width: 88%; }
    .bar { grid-template-columns: 96px minmax(0, 1fr) 54px; gap: 8px; }
    .card { padding: 12px; gap: 10px; }
    .pill { display: none; }
  }
  /* Low window: less room for the title, more for the conversation */
  @media (max-height: 520px) {
    header { padding: 10px 20px 8px; }
    header h1 { font-size: 18px; }
    .composer { padding-top: 8px; padding-bottom: 10px; }
    .brand { padding-bottom: 8px; }
    .logo { width: 34px; height: 34px; }
    .tab { padding-top: 7px; padding-bottom: 7px; }
    .week { height: 80px; }
  }

  /* Settings: a panel over the whole window. Save keeps the changes, ✕ throws them away. */
  .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: none; flex-direction: column; }
  .overlay.show { display: flex; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
  .ov-head { display: flex; align-items: center; gap: 14px; padding: 18px 24px; border-bottom: 1px solid var(--line); flex: none; }
  .ov-head h1 { margin: 0; font-size: 22px; font-weight: 600; flex: 1; white-space: nowrap; }
  .hint-top { color: var(--dim); max-width: 980px; margin: 0 auto 16px; }
  .stabs { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 3px; }
  .stabs button { border: 0; background: transparent; color: var(--dim); padding: 7px 16px; border-radius: 8px; font: inherit; cursor: pointer; }
  .stabs button.on { background: var(--grad); color: #fff; }

  /* Theme cards: a little preview of the bubble and orb in each theme's colours */
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; max-width: 980px; margin: 0 auto; }
  .tcard { border-radius: 16px; border: 2px solid var(--line); background: var(--panel); cursor: pointer; overflow: hidden; transition: .15s; }
  .tcard:hover { transform: translateY(-2px); border-color: var(--dim); }
  .tcard.on { border-color: var(--t-bright); box-shadow: 0 0 0 1px var(--t-bright), 0 8px 30px color-mix(in srgb, var(--t-main) 45%, transparent); }
  .tprev { height: 118px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 12px;
    background: radial-gradient(circle at 20% 30%, color-mix(in srgb, var(--t-main) 55%, transparent), transparent 55%),
                radial-gradient(circle at 85% 80%, color-mix(in srgb, var(--t-bright) 40%, transparent), transparent 55%), var(--t-deep); }
  .torb { width: 46px; height: 46px; border-radius: 50%; position: relative; overflow: hidden; background: var(--t-deep); flex: none;
    box-shadow: 0 0 20px var(--t-main), inset 0 0 0 1px rgba(255, 255, 255, .4); }
  .torb::before { content: ""; position: absolute; inset: -30%; filter: blur(6px); animation: swirl 6s linear infinite;
    background: radial-gradient(circle at 30% 35%, var(--t-main) 0 22%, transparent 42%), radial-gradient(circle at 70% 30%, var(--t-bright) 0 18%, transparent 40%),
                radial-gradient(circle at 60% 72%, var(--t-accent) 0 20%, transparent 42%); }
  .torb::after { content: ""; position: absolute; left: 22%; top: 8%; width: 55%; height: 32%; border-radius: 50%; background: radial-gradient(ellipse, rgba(255,255,255,.5), transparent 70%); }
  .tpill { height: 34px; width: 108px; border-radius: 17px; border: 1.5px solid transparent;
    background: linear-gradient(color-mix(in srgb, var(--t-deep) 85%, #000), color-mix(in srgb, var(--t-deep) 85%, #000)) padding-box,
                linear-gradient(90deg, var(--t-main), var(--t-accent), var(--t-bright)) border-box; }
  .tpill i { display: block; margin: 12px 14px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .55); width: 60%; }
  .tcard.legacy .torb { background: linear-gradient(135deg, var(--t-main), var(--t-middle), var(--t-bright)); }
  .tcard.legacy .torb::before, .tcard.legacy .torb::after { display: none; }
  .tcard.legacy .tpill { background: linear-gradient(135deg, var(--t-main), var(--t-middle), var(--t-bright)); border-color: rgba(255,255,255,.5); }
  .tinfo { padding: 12px 14px 14px; }
  .tinfo b { display: flex; align-items: center; gap: 8px; font-size: 15px; }
  .tinfo b .badge { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 8px; background: var(--t-main); color: #fff; }
  .tinfo span { color: var(--dim); font-size: 13px; }
  .close { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 17px; cursor: pointer; }
  .close:hover { border-color: #ff6b8b; color: #ff6b8b; }
  .ov-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px 24px 30px; }
  .ov-body::-webkit-scrollbar { width: 10px; }
  .ov-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid var(--bg); }
  .ov-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--line); flex: none; }
  .save { border: 0; background: var(--grad); color: #fff; border-radius: 10px; padding: 10px 26px; font: inherit; font-weight: 600; cursor: pointer; }
  .save:hover { filter: brightness(1.12); }
  .section { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 6px 18px 12px; margin: 0 auto 14px; max-width: 760px; }
  .section h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--cyan); margin: 12px 0 4px; }
  .field { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 4px 16px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .section h3 + .field { border-top: 0; }
  .field label { color: var(--text); }
  .field .hint { grid-column: 2; color: var(--dim); font-size: 12px; user-select: text; }
  .field .control { display: flex; gap: 8px; align-items: center; min-width: 0; flex-wrap: wrap; }
  .field input[type=text], .field input[type=password], .field select { flex: 1; min-width: 140px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 9px; padding: 8px 12px; color: var(--text); font: inherit; outline: none; }
  .field input:focus, .field select:focus { border-color: var(--violet); }
  .field select option { background: var(--panel2); }
  .field .switch { cursor: pointer; }
  .status { color: var(--dim); font-size: 13px; }
  .hidden { display: none !important; }
  @media (max-width: 620px) {
    .field { grid-template-columns: minmax(0, 1fr); }
    .field .hint { grid-column: 1; }
    .ov-head, .ov-body, .ov-foot { padding-left: 14px; padding-right: 14px; }
    .ov-head h1 span { display: none; } /* room for the tabs: just the gear */
  }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--panel2); border: 1px solid var(--line);
    padding: 10px 18px; border-radius: 12px; opacity: 0; transition: .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="app">
  <nav>
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div><b id="name">Dave</b><small id="version"></small></div>
    </div>
    <div class="tab active" data-view="chat"><span class="ico">💬</span><span data-t="chat"></span></div>
    <div class="tab" data-view="reminders"><span class="ico">⏰</span><span data-t="reminders"></span><span class="count" id="c-reminders"></span></div>
    <div class="tab" data-view="memories"><span class="ico">🧠</span><span data-t="memories"></span><span class="count" id="c-memories"></span></div>
    <div class="tab" data-view="screen"><span class="ico">⏱</span><span data-t="screen"></span></div>
    <div class="tab" data-view="music"><span class="ico">🎵</span><span data-t="music"></span></div>
    <div class="tab" data-view="watching"><span class="ico">👀</span><span data-t="watching"></span><span class="count" id="c-watching"></span></div>
    <div class="spacer"></div>
    <div class="toggle" id="quiet"><span>🤫 <span data-t="quiet"></span></span><div class="switch" id="quietSwitch"></div></div>
    <div class="tab" id="settings"><span class="ico">⚙️</span><span data-t="settings"></span></div>
  </nav>

  <main>
    <header><h1 id="title"></h1><span id="subtitle"></span></header>

    <section class="view active" id="chat"></section>
    <div class="composer show" id="composer">
      <button class="round alt" id="mic" title="Talk">🎙️</button>
      <input id="input" autocomplete="off" spellcheck="false">
      <button class="round" id="send">➤</button>
    </div>

    <section class="view" id="reminders"></section>
    <section class="view" id="memories"></section>
    <section class="view" id="screen"></section>
    <section class="view" id="music"></section>
    <section class="view" id="watching"></section>
  </main>
</div>
<div class="overlay" id="settingsPanel">
  <div class="ov-head">
    <h1>⚙️ <span data-t="settings"></span></h1>
    <div class="stabs"><button class="on" data-stab="settingsBody" data-t="general"></button><button data-stab="themeBody" data-t="theme"></button></div>
    <button class="close" id="settingsClose" title="Close without saving">✕</button>
  </div>
  <div class="ov-body" id="settingsBody"></div>
  <div class="ov-body hidden" id="themeBody"></div>
  <div class="ov-foot"><button class="btn" id="settingsCancel" data-t="cancel"></button><button class="save" id="settingsSave" data-t="save"></button></div>
</div>
<div class="toast" id="toast"></div>

<script>
const T = {
  en: {
    chat: "Chat", reminders: "Reminders", memories: "Memories", screen: "Screen time", music: "Music", watching: "Watching",
    quiet: "Quiet mode", settings: "Settings", placeholder: "Type a message…",
    "sub.chat": "Everything you talked about", "sub.reminders": "Timers and reminders, also repeating ones",
    "sub.memories": "Things Dave remembers about you", "sub.screen": "Time per app, while you're at your PC",
    "sub.music": "What's playing and what played", "sub.watching": "Heads-ups Dave is waiting for",
    noChat: "No conversations yet", noChatHint: "Type below or press {hotkey} and talk.",
    noReminders: "No reminders", noRemindersHint: "Say “remind me every day at 10 to drink water”.",
    noMemories: "Dave doesn't remember anything about you yet", addMemory: "Something Dave should remember…", add: "Add",
    today: "Today", week: "This week", noScreen: "No screen time yet", noScreenHint: "Dave counts it while he's running.",
    nowPlaying: "Now playing", nothingPlaying: "Nothing is playing", recent: "Recently played", disliked: "Songs you don't like",
    allow: "Allow again", noHistory: "No songs yet", noWatching: "Dave isn't watching anything",
    noWatchingHint: "Say “tell me when Discord closes”.", stopAll: "Stop watching all", next: "next",
    save: "Save", cancel: "Cancel", general: "General", theme: "Theme", current: "current",

  },
  nl: {
    chat: "Chat", reminders: "Herinneringen", memories: "Onthouden", screen: "Schermtijd", music: "Muziek", watching: "Opletten",
    quiet: "Stille modus", settings: "Instellingen", placeholder: "Typ een bericht…",
    "sub.chat": "Alles waar jullie het over hadden", "sub.reminders": "Timers en herinneringen, ook terugkerende",
    "sub.memories": "Wat Dave over je onthoudt", "sub.screen": "Tijd per app, terwijl je achter je pc zit",
    "sub.music": "Wat er speelt en wat er speelde", "sub.watching": "Seintjes waar Dave op wacht",
    noChat: "Nog geen gesprekken", noChatHint: "Typ hieronder of druk op {hotkey} en praat.",
    noReminders: "Geen herinneringen", noRemindersHint: "Zeg “herinner me elke dag om 10 uur om water te drinken”.",
    noMemories: "Dave onthoudt nog niets over je", addMemory: "Iets wat Dave moet onthouden…", add: "Toevoegen",
    today: "Vandaag", week: "Deze week", noScreen: "Nog geen schermtijd", noScreenHint: "Dave telt het terwijl hij draait.",
    nowPlaying: "Speelt nu", nothingPlaying: "Er speelt niets", recent: "Net gespeeld", disliked: "Nummers die je niet leuk vindt",
    allow: "Weer toestaan", noHistory: "Nog geen nummers", noWatching: "Dave let nergens op",
    noWatchingHint: "Zeg “laat het me weten als Discord sluit”.", stopAll: "Overal mee stoppen", next: "volgende",
    save: "Opslaan", cancel: "Annuleren", general: "Algemeen", theme: "Thema", current: "huidig",
    themeHint: "Verandert de bubbel, de bol, de gloed rond je scherm en dit venster. Klik er een om te proberen; Opslaan om te houden.",
  },
};
/* Errors in this page go to Dave's log (dave.log), so they can be found and fixed */
function report(err, where) {
  try { window.chrome.webview.postMessage({ type: "jsError", text: `${where || "page"}: ${err && err.message ? err.message : err} ${err && err.stack ? err.stack.split("\n").slice(0, 3).join(" | ") : ""}` }); } catch { }
}
window.addEventListener("error", e => report(e.error || e.message, `line ${e.lineno}:${e.colno}`));
window.addEventListener("unhandledrejection", e => report(e.reason, "promise"));

let lang = "en", state = null, view = "chat", period = "today", pending = [], rendered = {}, lastChatCount = -1;
const t = k => T[lang][k] || k;
const $ = id => document.getElementById(id);
const send = m => window.chrome.webview.postMessage(m);

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function empty(icon, title, hint) { const d = el("div", "empty"); d.append(el("span", "big", icon), el("div", null, title)); if (hint) d.append(el("div", "sub", hint)); return d; }
function hm(s) { const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : `${Math.max(1, m)}m`; }

document.querySelectorAll(".tab[data-view]").forEach(tab => tab.onclick = () => show(tab.dataset.view));
$("settings").onclick = openSettings;
$("settingsClose").onclick = closeSettings;
$("settingsCancel").onclick = closeSettings;
$("settingsSave").onclick = () => send({ type: "saveSettings", values: readSettings() });
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("settingsPanel").classList.contains("show")) closeSettings(); });

/* --- Settings panel --- */
const PROVIDERS = [["groq", "Groq (free, fastest)"], ["openai", "OpenAI"], ["openrouter", "OpenRouter"], ["custom", "Custom (OpenAI-compatible)"]];
const SPEEDS = [["0.85", "Slow"], ["1", "Normal"], ["1.15", "A bit faster"], ["1.3", "Fast"]];
const MODELS = { openai: "gpt-4.1-mini", openrouter: "openai/gpt-oss-120b", custom: "model name" };
let sdata = null, form = {};

function openSettings() { $("settingsPanel").classList.add("show"); $("settingsBody").textContent = ""; $("themeBody").textContent = ""; settingsTab("settingsBody"); send({ type: "getSettings" }); }
function closeSettings() { // ✕ / Cancel: nothing is saved, and a theme you were trying goes back to the saved one
  $("settingsPanel").classList.remove("show"); sdata = null;
  if (state) applyTheme(state.theme);
}
function settingsTab(id) {
  document.querySelectorAll("[data-stab]").forEach(b => b.classList.toggle("on", b.dataset.stab === id));
  for (const body of ["settingsBody", "themeBody"]) $(body).classList.toggle("hidden", body !== id);
}
document.querySelectorAll("[data-stab]").forEach(b => b.onclick = () => settingsTab(b.dataset.stab));

/* A theme: its colours for the whole page, and the plain original look for Legacy */
function applyTheme(th) {
  if (!th) return;
  const r = document.documentElement.style;
  r.setProperty("--purple", th.main); r.setProperty("--violet", th.middle); r.setProperty("--pink", th.accent);
  r.setProperty("--cyan", th.bright); r.setProperty("--deep", th.deep);
  document.body.classList.toggle("legacy", !!th.legacy);
}

function renderThemes(d) {
  const body = $("themeBody"); body.textContent = "";
  body.append(el("div", "hint-top", t("themeHint")));
  const grid = el("div", "themes");
  const hidden = el("input"); hidden.type = "hidden"; hidden.value = d.values.Theme; form.Theme = hidden;
  for (const th of d.themes) {
    const card = el("div", "tcard" + (th.legacy ? " legacy" : "") + (th.id === hidden.value ? " on" : ""));
    for (const [k, v] of [["main", th.main], ["middle", th.middle], ["accent", th.accent], ["bright", th.bright], ["deep", th.deep]]) card.style.setProperty(`--t-${k}`, v);
    const prev = el("div", "tprev"), pill = el("div", "tpill");
    pill.append(el("i"));
    prev.append(el("div", "torb"), pill);
    const info = el("div", "tinfo"), name = el("b", null, th.name);
    if (th.id === d.values.Theme) name.append(el("span", "badge", t("current")));
    info.append(name, el("span", null, th.description));
    card.append(prev, info);
    card.onclick = () => {
      hidden.value = th.id;
      grid.querySelectorAll(".tcard").forEach(c => c.classList.remove("on"));
      card.classList.add("on");
      applyTheme(th); // try it right away; Save keeps it, ✕ puts the old one back
    };
    grid.append(card);
  }
  body.append(grid);
}

function readSettings() {
  const v = {};
  for (const [k, input] of Object.entries(form)) v[k] = input.type === "switch" ? input.classList.contains("on") : input.value; // also the hidden Theme
  return v;
}

function options(select, items, chosen) {
  select.textContent = "";
  for (const item of items) {
    const [value, label] = Array.isArray(item) ? item : typeof item === "object" ? [item.id, item.name] : [item, item];
    const o = el("option", null, label); o.value = value; select.append(o);
  }
  if (chosen && ![...select.options].some(o => o.value === chosen)) { const o = el("option", null, chosen); o.value = chosen; select.append(o); }
  select.value = chosen || (select.options[0] ? select.options[0].value : "");
}

function renderSettings(d) {
  sdata = d; form = {};
  const body = $("settingsBody"); body.textContent = "";
  const v = d.values;
  let section;
  const sec = title => { section = el("div", "section"); section.append(el("h3", null, title)); body.append(section); };
  const field = (key, label, make, hint, show) => {
    const f = el("div", "field"), control = el("div", "control"), input = make(control);
    if (input) { form[key] = input; control.prepend(input); }
    f.append(el("label", null, label), control);
    if (hint) f.append(el("div", "hint", hint));
    if (show) f.dataset.show = show;
    section.append(f);
    return f;
  };
  const text = (key, placeholder, password) => () => { const i = el("input"); i.type = password ? "password" : "text"; i.value = v[key] ?? ""; i.placeholder = placeholder || ""; i.spellcheck = false; return i; };
  const select = (key, items) => () => { const s = el("select"); options(s, items, v[key]); return s; };
  const toggle = key => () => { const s = el("div", "switch" + (v[key] ? " on" : "")); s.type = "switch"; s.onclick = () => s.classList.toggle("on"); return s; };
  const button = (label, onclick) => { const b = el("button", "btn", label); b.onclick = onclick; return b; };

  sec("AI");
  field("GroqKey", "Groq API key", text("GroqKey", "gsk_…", true), "Free at console.groq.com/keys. Listening always uses this key (or OpenAI).");
  field("AiProvider", "AI provider", select("AiProvider", PROVIDERS));
  field("AiKey", "Provider key", text("AiKey", "API key", true), null, "provider");
  field("AiModel", "Model", text("AiModel", ""), "Empty = the provider's default.", "provider");
  field("AiBaseUrl", "Provider address", text("AiBaseUrl", "http://localhost:11434/v1 (Ollama)"), null, "custom");

  sec("You");
  field("AssistantName", "Name", text("AssistantName", "Dave"), "Empty = Dave.");
  field("WakePhrase", "Wake phrase", text("WakePhrase", ""), "Empty = “hey” + the name. E.g. hey jarvis, whats up dave, yo computer.");
  field("Country", "Country", text("Country", "the Netherlands"), "For units, currency and local results.");
  field("Language", "Main language", text("Language", "nl-NL"), "e.g. nl-NL or en-US");
  field("SecondLanguage", "Second language", text("SecondLanguage", "en-US"), "Empty = none.");
  field("Browser", "Browser for websites", text("Browser", "Windows default"), "e.g. Brave, Chrome. Empty = Windows' default.");

  sec("Voice");
  field("VoiceEngine", "Voice engine", select("VoiceEngine", [["windows", "Windows voices (offline, free)"], ["azure", "Azure voices (online, natural)"]]));
  field("Voice", "Main-language voice", c => { const s = el("select"); options(s, d.voices.main, v.Voice); c.append(button("▶", () => preview("windows", "main"))); return s; }, null, "windows");
  field("SecondVoice", "Second-language voice", c => { const s = el("select"); options(s, d.voices.second, v.SecondVoice); c.append(button("▶", () => preview("windows", "second"))); return s; }, null, "windows");
  field("AzureKey", "Azure key", text("AzureKey", "", true), null, "azure");
  field("AzureRegion", "Azure region", c => {
    const i = text("AzureRegion", "westeurope")();
    const status = el("span", "status"); status.id = "azureStatus";
    c.append(button("Load Azure voices", () => { status.textContent = "Loading…"; send({ type: "azureVoices", values: readSettings() }); }), status);
    return i;
  }, null, "azure");
  field("AzureVoice", "Main-language voice", c => { const s = el("select"); options(s, [], v.AzureVoice); c.append(button("▶", () => preview("azure", "main"))); return s; }, null, "azure");
  field("AzureSecondVoice", "Second-language voice", c => { const s = el("select"); options(s, [], v.AzureSecondVoice); c.append(button("▶", () => preview("azure", "second"))); return s; }, null, "azure");
  field("SpeechRate", "Speaking speed", select("SpeechRate", SPEEDS));

  sec("Shortcuts and listening");
  field("Hotkey", "Talk shortcut", text("Hotkey", "Ctrl+Alt+D"));
  field("WindowHotkey", "Window shortcut", text("WindowHotkey", "Ctrl+Alt+W"), "Opens and closes this window.");
  field("WakeWord", "Listen for the wake phrase", toggle("WakeWord"), "Offline: nothing is sent anywhere until it hears it.");
  field("StartWithWindows", "Start with Windows", toggle("StartWithWindows"));
  field("AutoUpdate", "Update automatically", toggle("AutoUpdate"), `Now version ${d.version}.`);

  sec("Calendar");
  field("CalendarLinks", "Calendar link (iCal)", text("CalendarLinks", "https://calendar.google.com/calendar/ical/…/basic.ics"),
    "Google Calendar: Settings → your calendar → “Secret address in iCal format”. Outlook: Settings → Calendar → Shared calendars → Publish → ICS. Several: separate with spaces.");

  sec("Spotify (Premium)");
  field("SpotifyClientId", "Client ID", c => {
    const i = text("SpotifyClientId", "")();
    const status = el("span", "status", d.spotify); status.id = "spotifyStatus";
    c.append(button("Connect Spotify", () => send({ type: "spotifyConnect", clientId: i.value })), status);
    return i;
  }, `From developer.spotify.com/dashboard. Add this Redirect URI to your app there: ${d.redirect}`);

  // Language changed: the Windows voices for it
  form.Language.onchange = () => send({ type: "voices", field: "Voice", lang: form.Language.value });
  form.SecondLanguage.onchange = () => send({ type: "voices", field: "SecondVoice", lang: form.SecondLanguage.value });
  form.AiProvider.onchange = form.VoiceEngine.onchange = updateSettingsVisibility;
  updateSettingsVisibility();
  renderThemes(d);
}

/* Show only what matters for the chosen provider and voice engine */
function updateSettingsVisibility() {
  const provider = form.AiProvider.value, engine = form.VoiceEngine.value;
  form.AiModel.placeholder = MODELS[provider] || "";
  for (const f of $("settingsBody").querySelectorAll(".field[data-show]")) {
    const s = f.dataset.show;
    const on = s === "provider" ? provider !== "groq" : s === "custom" ? provider === "custom" : s === engine;
    f.classList.toggle("hidden", !on);
  }
}

function preview(engine, which) { send({ type: "preview", engine, which, values: readSettings() }); }
$("quiet").onclick = () => send({ type: "quiet", on: !(state && state.quiet) });
$("mic").onclick = () => send({ type: "listen" });
$("send").onclick = ask;
$("input").onkeydown = e => { if (e.key === "Enter") ask(); };
function ask() {
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  pending.push({ text, chatLength: state ? state.chat.length : 0 });
  send({ type: "ask", text });
  rendered.chat = null; renderChat();
}

function show(name) {
  view = name;
  document.querySelectorAll(".tab[data-view]").forEach(x => x.classList.toggle("active", x.dataset.view === name));
  document.querySelectorAll(".view").forEach(x => x.classList.toggle("active", x.id === name));
  $("composer").classList.toggle("show", name === "chat");
  $("title").textContent = t(name);
  $("subtitle").textContent = t("sub." + name);
  if (name === "chat") { $("input").focus(); scrollChat(true); }
}

function labels() {
  document.querySelectorAll("[data-t]").forEach(x => x.textContent = t(x.dataset.t));
  $("input").placeholder = t("placeholder");
  $("title").textContent = t(view);
  $("subtitle").textContent = t("sub." + view);
}

/* Only rebuild a view when its data changed, so scrolling and typing aren't disturbed. */
function changed(key, data) { const json = JSON.stringify(data); if (rendered[key] === json) return false; rendered[key] = json; return true; }

function scrollChat(force) {
  const c = $("chat");
  if (force || c.scrollHeight - c.scrollTop - c.clientHeight < 160) c.scrollTop = c.scrollHeight;
}

/* "what's  this?" and "What's this" count as the same: the log merges spaces, so an exact match never came */
const same = (a, b) => a.replace(/\s+/g, " ").trim().toLowerCase() === b.replace(/\s+/g, " ").trim().toLowerCase();

function renderChat() {
  const chat = state ? state.chat : [];
  // A sent message shows until it's in the chat; also gone once anything new arrived after sending it
  pending = pending.filter(p => !chat.slice(-6).some(e => same(e.you, p.text)) && chat.length <= p.chatLength);
  const thinking = state && state.status === "thinking";
  if (!changed("chat", [chat, pending.map(p => p.text), thinking])) return;
  const c = $("chat"); c.textContent = "";
  if (!chat.length && !pending.length) { c.append(empty("💬", t("noChat"), t("noChatHint").replace("{hotkey}", state ? state.hotkey : ""))); return; }
  let lastDay = null;
  for (const e of chat) {
    const day = e.at.includes(":") && e.at.length <= 5 ? t("today") : e.at.split(" ").slice(0, 3).join(" ");
    if (day !== lastDay) { c.append(el("div", "day", day)); lastDay = day; }
    if (!e.you.startsWith("(")) { const you = el("div", "msg you", e.you); c.append(you); }
    const dave = el("div", "msg dave", e.dave.replace(/^\([a-z_]+\)\s*/, "")); // "(set_reminder) Okay…" -> "Okay…"
    dave.append(el("span", "time", e.at.split(" ").pop()));
    c.append(dave);
  }
  // Only what's new slides in (not the whole history every time it's redrawn)
  const msgs = c.querySelectorAll(".msg");
  const fresh = lastChatCount >= 0 ? (chat.length - lastChatCount) * 2 : 0;
  for (let i = Math.max(0, msgs.length - fresh); i < msgs.length; i++) msgs[i].classList.add("new");
  lastChatCount = chat.length;
  for (const p of pending) c.append(el("div", "msg you pending new", p.text));
  // The three dots only while Dave is working out the answer, not once it's there
  const typing = el("div", "typing" + (thinking || pending.length ? " show" : ""));
  typing.append(el("i"), el("i"), el("i"));
  c.append(typing);
  scrollChat(pending.length > 0);
}

function renderReminders() {
  if (!changed("reminders", state.reminders)) return;
  const v = $("reminders"); v.textContent = "";
  if (!state.reminders.length) { v.append(empty("⏰", t("noReminders"), t("noRemindersHint"))); return; }
  for (const r of state.reminders) {
    const card = el("div", "card"), main = el("div", "main");
    main.append(el("div", "title", r.message), el("div", "sub", `${t("next")}: ${r.next}`));
    const x = el("button", "x", "✕"); x.onclick = () => send({ type: "deleteReminder", id: r.id });
    card.append(el("span", null, "⏰"), main, el("span", "pill", r.repeat), x);
    v.append(card);
  }
}

function renderMemories() {
  if (!changed("memories", state.memories)) return;
  const v = $("memories"); v.textContent = "";
  const row = el("div", "row"), input = el("input"), add = el("button", "btn", t("add"));
  input.placeholder = t("addMemory");
  const save = () => { if (input.value.trim()) { send({ type: "addMemory", text: input.value.trim() }); input.value = ""; } };
  add.onclick = save; input.onkeydown = e => { if (e.key === "Enter") save(); };
  row.append(input, add); v.append(row);
  if (!state.memories.length) { v.append(empty("🧠", t("noMemories"))); return; }
  for (const m of state.memories) {
    const card = el("div", "card"), main = el("div", "main");
    main.append(el("div", null, m));
    const x = el("button", "x", "✕"); x.onclick = () => send({ type: "deleteMemory", text: m });
    card.append(el("span", null, "🧠"), main, x); v.append(card);
  }
}

function renderScreen() {
  if (!changed("screen", [state.screen, period])) return;
  const v = $("screen"); v.textContent = "";
  const seg = el("div", "seg");
  for (const p of ["today", "week"]) { const b = el("button", period === p ? "on" : "", t(p)); b.onclick = () => { period = p; renderScreen(); }; seg.append(b); }
  v.append(seg);
  const apps = state.screen[period];
  if (!apps.length) { v.append(empty("⏱", t("noScreen"), t("noScreenHint"))); return; }
  v.append(el("div", "total", hm(apps.reduce((a, b) => a + b.seconds, 0))));
  if (period === "week") {
    const week = el("div", "week"), max = Math.max(...state.screen.days.map(d => d.seconds), 1);
    for (const d of state.screen.days) {
      const col = el("div"), bar = el("i");
      bar.style.height = `${Math.round(d.seconds / max * 100)}%`; bar.title = hm(d.seconds);
      col.append(bar, el("span", null, d.day)); week.append(col);
    }
    v.append(week);
  }
  v.append(el("h2", null, t("screen")));
  const max = apps[0].seconds;
  for (const a of apps) {
    const bar = el("div", "bar"), track = el("div", "track"), fill = el("div", "fill");
    fill.style.width = `${Math.max(2, a.seconds / max * 100)}%`; track.append(fill);
    bar.append(el("div", "name", a.app), track, el("div", "val", hm(a.seconds))); v.append(bar);
  }
}

function renderMusic() {
  if (!changed("music", state.music)) return;
  const v = $("music"), m = state.music; v.textContent = "";
  v.append(el("h2", null, t("nowPlaying")));
  if (m.now) {
    const now = el("div", "now"), info = el("div");
    info.append(el("div", "title", m.now.title), el("div", "sub", m.now.artist));
    now.append(el("div", "disc"), info); v.append(now);
  } else v.append(el("div", "card", t("nothingPlaying")));
  v.append(el("h2", null, t("recent")));
  if (!m.history.length) v.append(el("div", "sub", t("noHistory")));
  for (const s of m.history) {
    const card = el("div", "card"), main = el("div", "main");
    main.append(el("div", "title", s.title), el("div", "sub", s.artist));
    card.append(el("span", null, "🎵"), main, el("span", "pill", s.at)); v.append(card);
  }
  if (m.disliked.length) {
    v.append(el("h2", null, t("disliked")));
    for (const s of m.disliked) {
      const card = el("div", "card"), main = el("div", "main"), allow = el("button", "btn", t("allow"));
      main.append(el("div", "title", s.title), el("div", "sub", s.artist));
      allow.onclick = () => send({ type: "undislike", title: s.title, artist: s.artist });
      card.append(el("span", null, "🚫"), main, allow); v.append(card);
    }
  }
}

function renderWatching() {
  if (!changed("watching", state.watching)) return;
  const v = $("watching"); v.textContent = "";
  if (!state.watching.length) { v.append(empty("👀", t("noWatching"), t("noWatchingHint"))); return; }
  for (const w of state.watching) { const card = el("div", "card"); card.append(el("span", null, "👀"), el("div", "main", w)); v.append(card); }
  const stop = el("button", "btn", t("stopAll")); stop.onclick = () => send({ type: "stopWatching" }); v.append(stop);
}

function count(id, n) { $(id).textContent = n || ""; $(id).style.display = n ? "" : "none"; }

window.chrome.webview.addEventListener("message", e => {
  const m = e.data;
  if (m.type === "toast") {
    const toast = $("toast"); toast.textContent = m.text; toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2500);
    pending = []; rendered.chat = null; renderChat();
    return;
  }
  if (m.type === "openSettings") { openSettings(); return; }
  if (m.type === "settingsData") { if ($("settingsPanel").classList.contains("show")) renderSettings(m); return; }
  if (m.type === "voices" && sdata) { options(form[m.field], m.items, form[m.field].value); return; }
  if (m.type === "azureVoices" && sdata) {
    $("azureStatus").textContent = m.status || "";
    if (m.main) { options(form.AzureVoice, m.main, form.AzureVoice.value); options(form.AzureSecondVoice, m.second, form.AzureSecondVoice.value); }
    return;
  }
  if (m.type === "spotify") { const s = $("spotifyStatus"); if (s) s.textContent = m.status; return; }
  if (m.type === "saved") {
    closeSettings();
    const toast = $("toast"); toast.textContent = m.warning || (lang === "nl" ? "Opgeslagen ✓" : "Saved ✓"); toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), m.warning ? 7000 : 2000);
    return;
  }
  if (m.type !== "state") return;
  const first = !state;
  state = m;
  const newLang = m.dutch ? "nl" : "en";
  if (newLang !== lang || first) { lang = newLang; rendered = {}; labels(); }
  if (!$("settingsPanel").classList.contains("show")) applyTheme(m.theme); // not while you're trying themes in the settings
  $("name").textContent = m.name;
  $("version").textContent = "v" + m.version;
  $("logo").classList.toggle("busy", m.busy);
  $("mic").classList.toggle("listening", m.status === "listening"); // the bubble stays away while this window is open
  $("quietSwitch").classList.toggle("on", m.quiet);
  count("c-reminders", m.reminders.length); count("c-memories", m.memories.length); count("c-watching", m.watching.length);
  // Each tab on its own: a problem in one never leaves the others empty
  for (const render of [renderChat, renderReminders, renderMemories, renderScreen, renderMusic, renderWatching]) {
    try { render(); } catch (err) { report(err, render.name); }
  }
  if (first) { show("chat"); }
});
labels();
send({ type: "ready" });
</script>
